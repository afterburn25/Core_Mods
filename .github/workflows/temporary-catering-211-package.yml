name: Temporary Catering 2.1.1 package builder

# One-time controlled branch-only packaging. Remove this workflow before
# merging into the authoritative module branch.
on:
  push:
    branches: [chatgpt/catering-social-placement-211-20261103]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build versioned module ZIP with exact source and checksum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('modules/industry-catering')
          manifest = json.loads((root/'addon.json').read_text())
          assert manifest['version'] == '2.1.1'
          assert manifest['requires']['core'] == '>=2.6.2,<3.0.0'
          files = sorted(
            p for p in root.rglob('*')
            if p.is_file() and not any(x in ('releases','tests','tools') for x in p.relative_to(root).parts)
          )
          assert files and all(p.suffix.lower() != '.zip' for p in files)
          assert len(files) >= 125, f'Unexpected packaged inventory: {len(files)}'
          out = root/'releases/industry-catering-2.1.1.zip'
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
            for p in files:
              name = p.relative_to(root).as_posix()
              info = zipfile.ZipInfo(name, (2026, 11, 3, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = ((0o100000 | 0o644) << 16)
              z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(out) as z:
            members = z.namelist()
            assert len(members) == len(files) and len(members) == len(set(members))
            assert all(not n.lower().endswith('.zip') for n in members)
            assert json.loads(z.read('addon.json'))['version'] == '2.1.1'
            for name in ('src/Provider.php','views/themes/heritage-editorial.php','docs/RELEASE_NOTES_2.1.1.md','migrations/0008_event_workspace.php'):
              assert name in members
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          latest = {
            'module_id': 'cajunwebpro/catering',
            'version': '2.1.1',
            'file': out.name,
            'sha256': digest,
            'module_api': 1,
            'verified_core': '2.6.2',
            'released_at': '2026-11-03',
            'verification': 'Source archive is packaged and checksummed; GitHub test acceptance pending',
            'tested_core': '2.6.2',
            'tested_core_commit': 'c5d7e379e74fd584afc55e755be4da561116f7c6',
            'ci': {'module': 'pending', 'acceptance': 'pending'}
          }
          (root/'releases/LATEST.json').write_text(json.dumps(latest, indent=2) + '\n')
          print(f'Module archive {out}: {len(files)} files, SHA-256 {digest}')
          PY
          git add modules/industry-catering/releases/industry-catering-2.1.1.zip modules/industry-catering/releases/LATEST.json
          if git diff --cached --quiet; then
            echo 'Module release already packaged'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package immutable Catering 2.1.1 module release with checksum"
          git push origin HEAD:refs/heads/chatgpt/catering-social-placement-211-20261103
