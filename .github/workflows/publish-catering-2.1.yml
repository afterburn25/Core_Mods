name: Publish Catering 2.1 payload

on:
  push:
    branches: [module/catering]
    paths:
      - .github/catering-transfer-2.1/**
      - .github/workflows/publish-catering-2.1.yml

permissions:
  contents: write

concurrency:
  group: catering-2.1-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/catering
          fetch-depth: 0
      - name: Reconstruct the verified source tree
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/catering-2.1.tar.gz"
          cat .github/catering-transfer-2.1/part-* > "$payload"
          echo "0938d1eadd1115fb2e13580fb6c28d7abad1b5ddcfa0bd2275728b089c893480  $payload" | sha256sum -c -
          rm -rf modules/industry-catering
          tar -xzf "$payload" -C .
          rm -rf .github/catering-transfer-2.1
          rm -f .github/workflows/publish-catering-2.1.yml
      - name: Commit the verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Catering 2.1.0 commercial themes"
          git push origin HEAD:module/catering
