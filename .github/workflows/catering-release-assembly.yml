name: Assemble Catering release

on:
  push:
    branches: [module/catering]
    paths:
      - 'modules/industry-catering/releases/.release-upload/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified release archive
        shell: bash
        run: |
          set -euo pipefail
          upload_dir='modules/industry-catering/releases/.release-upload'
          archive='modules/industry-catering/releases/industry-catering-1.5.0.zip'
          test -d "$upload_dir" || exit 0
          cat "$upload_dir"/part-*.b64 | base64 --decode > "$archive"
          echo 'e99f9a6c753600260d853b434209ad75b7cfeeaef8d78e94287b069fb1d6c3f0  modules/industry-catering/releases/industry-catering-1.5.0.zip' | sha256sum -c -
          if unzip -Z1 "$archive" | grep -Eqi '\.zip$'; then
            echo 'Nested ZIP detected' >&2
            exit 1
          fi
          rm -rf "$upload_dir"
          rm -f '.github/workflows/catering-release-assembly.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble Catering 1.5.0 release archive'
          git push origin HEAD:module/catering
