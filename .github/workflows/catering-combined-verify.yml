name: Catering combined bundle verification
on:
  push:
    branches: ['module/catering']
permissions:
  contents: read
jobs:
  combined:
    if: contains(github.event.head_commit.message, '[catering-combined-verify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: afterburn25/Website_Core
          ref: 99d13cf09488ef4990345ce229c60b334b6ca6d2
          path: .core-combined
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, zip
      - name: Assemble exact Core 2.6.1 and Catering 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .core-combined/examples/industry-catering
          mkdir -p .core-combined/examples/industry-catering
          unzip -q modules/industry-catering/releases/industry-catering-2.0.1.zip -d .core-combined/examples/industry-catering
          composer install --working-dir=.core-combined --no-interaction --no-progress --prefer-dist
          php .core-combined/tools/release-gate.php
          WC_BUILD_VENDOR_DIR="$GITHUB_WORKSPACE/.core-combined/vendor" php .core-combined/tools/build-packages.php test-bundle catering /tmp/catering-combined
      - name: Verify actual combined artifact and fresh install
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find /tmp/catering-combined -maxdepth 1 -name 'Website-Core-catering-2.6.1-TEST-BUNDLE.zip' -print -quit)"
          test -n "$bundle"
          unzip -t "$bundle"
          test -z "$(unzip -Z1 "$bundle" | grep -Ei '\\.zip$' || true)"
          php .core-combined/tools/verify-artifact.php "$bundle"
          php -r '$z=new ZipArchive();$p=glob("/tmp/catering-combined/*TEST-BUNDLE.zip")[0]??"";if($z->open($p)!==true)exit(1);$m=json_decode((string)$z->getFromName("modules/industries/industry-catering/addon.json"),true,512,JSON_THROW_ON_ERROR);if(($m["version"]??"")!=="2.0.1"||($m["requires"]["core"]??"")!==">=2.6.1,<3.0.0"||isset($m["license_key"]))exit(2);foreach(["install.php","install/index.php","core/Install/Installer.php","vendor/autoload.php"] as $f)if($z->locateName($f)===false)exit(3);echo "combined artifact contract OK\n";'
          sha256sum "$bundle"
