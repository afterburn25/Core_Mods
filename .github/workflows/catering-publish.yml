name: Catering 2.0 bounded publication
on:
  push:
    branches: ['module/catering']
permissions:
  contents: write
jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[catering-2.0-transfer]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, verify, and publish module source
        shell: bash
        run: |
          set -euo pipefail
          cat .catering-transfer/part-* | base64 --decode > /tmp/catering-2.0.0.bundle
          echo "a15e9bf5dd5e2c3074a383686cfef4db313fdd58f790bb35b5b4886a8f996179  /tmp/catering-2.0.0.bundle" | sha256sum --check
          git bundle verify /tmp/catering-2.0.0.bundle
          git fetch /tmp/catering-2.0.0.bundle refs/heads/module/catering:refs/remotes/transfer/catering
          test "$(git rev-parse refs/remotes/transfer/catering)" = "6771f204b0747ff237c8041cb17fa9e5a498eccf"
          cp .github/workflows/catering-ci.yml /tmp/catering-ci.yml
          cp .github/workflows/catering-publish.yml /tmp/catering-publish.yml
          git read-tree --reset -u refs/remotes/transfer/catering
          if [ -e .catering-transfer ]; then git rm -r .catering-transfer; fi
          mkdir -p .github/workflows
          cp /tmp/catering-ci.yml .github/workflows/catering-ci.yml
          cp /tmp/catering-publish.yml .github/workflows/catering-publish.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Assemble Catering 2.0 module source"
          git push origin HEAD:module/catering
