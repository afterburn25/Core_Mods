name: Publish Catering 2.0.2 archive

on:
  push:
    branches: [module/catering]
    paths:
      - 'modules/industry-catering/**'
      - '.github/workflows/publish-catering-2.0.2.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: module/catering
      - name: Build deterministic module archive
        run: python3 modules/industry-catering/tools/build-release.py
      - name: Commit release archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/industry-catering/releases
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Catering 2.0.2 release archive"
          git push origin HEAD:module/catering
