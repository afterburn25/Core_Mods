name: Module CI

on:
  push:
    branches: ['main', 'module/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Validate repository and releases
        run: php tools/validate-modules.php
      - name: Lint module PHP
        run: |
          if [ -d modules ]; then
            files=$(find modules -type f -name '*.php' -print)
            if [ -n "$files" ]; then
              while IFS= read -r file; do php -l "$file"; done <<< "$files"
            fi
          fi
