name: Publish corrected Catering 0.2.1 candidate
on:
  push:
    branches: ['module/catering']
    paths: ['.github/workflows/catering-publish-candidate.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 87f516ae7b9307cfe8ede60deeee7a855e7e2ad4
          fetch-depth: 1
      - name: Assemble and verify the corrected module-only archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root = Path('modules/industry-catering')
          parts = sorted((root / 'tools/.publication').glob('part-*.b64'))
          assert len(parts) == 37, len(parts)
          encoded = ''.join(p.read_text() for p in parts)
          assert len(encoded) == 2209176, len(encoded)
          data = base64.b64decode(encoded, validate=True)
          assert len(data) == 1656882, len(data)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '1155bf0ca31487375295248555b3c12dad8494f1a679996b190a52cba98a196f', digest
          latest = json.loads((root / 'releases/LATEST.json').read_text())
          assert latest['sha256'] == digest
          archive = root / 'releases' / latest['file']
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert 'addon.json' in z.namelist()
              assert 'src/CatalogResources.php' in z.namelist()
              assert not any(n.lower().endswith('.zip') for n in z.namelist())
          print(f'Verified {archive}: {len(data)} bytes, SHA-256 {digest}')
          PY
      - name: Create the exact corrected candidate commit
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$EVENT_COMMIT"
          git rm -r modules/industry-catering/tools/.publication
          git add modules/industry-catering/releases/industry-catering-0.2.1.zip
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = 7ab879dcab15c2c877cb3c4e902e956ef948aad2
          candidate_commit="$(git commit-tree "$candidate_tree" -p "$EVENT_COMMIT" -m 'Fix Catering 0.2.1 clean-install resource registration')"
          git push origin "$candidate_commit:refs/heads/module/catering"
