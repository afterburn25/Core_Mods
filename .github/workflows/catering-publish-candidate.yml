name: Publish exact Catering candidate
on:
  push:
    branches: ['module/catering']
    paths: ['.github/workflows/catering-publish-candidate.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 808f697cdc9e184dc264e4b6853c73fda381413f
          fetch-depth: 1
      - name: Assemble and verify the original module-only archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zipfile
          root = Path('modules/industry-catering')
          parts = sorted((root / 'tools/.publication').glob('part-*.b64'))
          assert len(parts) == 37, len(parts)
          encoded = ''.join(p.read_text() for p in parts)
          assert len(encoded) == 2201124
          data = base64.b64decode(encoded, validate=True)
          assert len(data) == 1650842
          digest = hashlib.sha256(data).hexdigest()
          assert digest == 'd760e0e76f6996904bde04f9e94bd3b6763fc539c811219c9b5f2c6df4c2a26f', digest
          latest = json.loads((root / 'releases/LATEST.json').read_text())
          assert latest['sha256'] == digest
          archive = root / 'releases' / latest['file']
          archive.write_bytes(data)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert 'addon.json' in z.namelist()
              assert not any(n.lower().endswith('.zip') for n in z.namelist())
          print(f'Verified {archive}: {len(data)} bytes, SHA-256 {digest}')
          PY
      - name: Publish the complete candidate and remove transfer files
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$EVENT_COMMIT"
          git rm -r modules/industry-catering/tools/.publication
          git add modules/industry-catering/releases/industry-catering-0.2.0.zip
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = 73a3dc4fdd8d27757c5593f078004c0c09cf3a80
          candidate_commit="$(git commit-tree "$candidate_tree" -p "$EVENT_COMMIT" -m 'Publish reconciled Catering 0.2.0 candidate with verified module archive')"
          git push origin "$candidate_commit:refs/heads/module/catering"
          echo "Published candidate: $candidate_commit"
